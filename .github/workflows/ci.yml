name: Java CI

on: [push, pull_request, workflow_dispatch]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          architecture: x64
          cache: 'maven'
      - name: Run unit tests
        run: mvn test -Dtest=PricingServiceTest,passwordPolicyTest,UserUnitTest

  quality:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout du repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          architecture: x64
          cache: 'maven'
      - name: Quality checks (Checkstyle + SpotBugs)
        run: mvn verify -DskipTests

  integration-tests:
    runs-on: ubuntu-latest
    needs: [unit-tests, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          architecture: x64
          cache: 'maven'
      - name: Run integration tests
        run: mvn test -Dtest=PricingIntegrationTest,ConfigIntegrationTest,UserServiceFunctionalTest

